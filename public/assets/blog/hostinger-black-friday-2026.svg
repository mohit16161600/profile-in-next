<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Hostinger Black Friday 2026 India price ladder with renewal rates">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.2" r="0.78">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 150h1200M0 300h1200M0 450h1200"/>
    <path d="M300 0v630M600 0v630M900 0v630"/>
  </g>

  <text x="80" y="104" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" letter-spacing="6" fill="#f59e0b" font-weight="600">BLACK FRIDAY 2026</text>
  <rect x="80" y="122" width="220" height="3" fill="url(#rule)"/>

  <text x="80" y="196" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Hostinger India</text>
  <text x="80" y="262" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="58" font-weight="700" fill="#ffffff">sale price vs renewal</text>

  <text x="80" y="316" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="24" fill="#9aa4b2">Checked on the India storefront · 16 November 2026 · pre-GST</text>

  <g font-family="Segoe UI, Inter, system-ui, sans-serif">
    <text x="80" y="386" font-size="20" fill="#6b7280" letter-spacing="2">PLAN</text>
