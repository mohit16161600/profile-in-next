    <text x="640" y="386" font-size="20" fill="#6b7280" letter-spacing="2">RENEWS AT</text>
    <text x="950" y="386" font-size="20" fill="#6b7280" letter-spacing="2">JUMP</text>
    <rect x="80" y="400" width="1040" height="1" fill="#ffffff" fill-opacity="0.08"/>

    <text x="80" y="446" font-size="28" fill="#e5e7eb" font-weight="600">Single</text>
    <text x="400" y="446" font-size="28" fill="#ffffff" font-weight="700">&#8377;69</text>
    <text x="640" y="446" font-size="28" fill="#e5e7eb">&#8377;289</text>
    <text x="950" y="446" font-size="28" fill="#f59e0b" font-weight="700">+319%</text>

    <text x="80" y="498" font-size="28" fill="#e5e7eb" font-weight="600">Premium</text>
    <text x="400" y="498" font-size="28" fill="#ffffff" font-weight="700">&#8377;139</text>
    <text x="640" y="498" font-size="28" fill="#e5e7eb">&#8377;449</text>
    <text x="950" y="498" font-size="28" fill="#f59e0b" font-weight="700">+223%</text>

    <text x="80" y="550" font-size="28" fill="#e5e7eb" font-weight="600">KVM 2 VPS</text>
    <text x="400" y="550" font-size="28" fill="#ffffff" font-weight="700">&#8377;779</text>
    <text x="640" y="550" font-size="28" fill="#e5e7eb">&#8377;1,199</text>
    <text x="950" y="550" font-size="28" fill="#34d399" font-weight="700">+54%</text>
