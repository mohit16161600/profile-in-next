<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Hostinger Plans &amp; Pricing India">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050a"/>
      <stop offset="0.55" stop-color="#080b16"/>
      <stop offset="1" stop-color="#0b0f1c"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.08" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.98" cy="0.08" r="0.8">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.78" cy="1.0" r="0.95">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>

  <!-- decorative orbit, top-right -->
  <g transform="translate(1012 150)" opacity="0.9">
    <circle r="240" fill="url(#bar)" opacity="0.10" filter="url(#soft)"/>
    <ellipse rx="150" ry="58" fill="none" stroke="#fb923c" stroke-opacity="0.35" stroke-width="2" transform="rotate(-22)"/>
    <ellipse rx="110" ry="110" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="150" cy="-58" r="9" fill="#fb923c"/>
    <circle cx="-104" cy="40" r="6" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="20" fill="url(#bar)"/>
  </g>

  <!-- thin top border accent -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#bar)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
    <!-- category chip -->
    <rect x="84" y="96" rx="23" ry="23" width="284.5" height="46" fill="#ffffff" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.5"/>
    <circle cx="112" cy="119" r="6" fill="#fbbf24"/>
    <text x="130" y="127" font-size="22" font-weight="700" letter-spacing="2.5" fill="#f3f4f6">PRICING GUIDE</text>

    <!-- title -->
    <text font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-1.5" filter="url(#tshadow)"><tspan x="84" y="282">Hostinger Plans &amp;</tspan><tspan x="84" y="378">Pricing India</tspan></text>

    <!-- divider -->
    <rect x="84" y="486" width="132" height="6" rx="3" fill="url(#bar)"/>

    <!-- brand row -->
    <circle cx="110" cy="560" r="26" fill="url(#bar)"/>
    <text x="110" y="569" font-size="24" font-weight="800" fill="#04050a" text-anchor="middle">MK</text>
    <text x="150" y="552" font-size="30" font-weight="800" fill="#f9fafb">mohitkoli<tspan fill="#fb923c">.info</tspan></text>
    <text x="150" y="582" font-size="19" font-weight="500" fill="#9aa3b2">Mohit Koli — Senior Full Stack Developer</text>
  </g>
</svg>
